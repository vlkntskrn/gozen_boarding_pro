name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "fix/security-boarding-validation" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Boarding validation tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gozen-boarding-pro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix security-tests
      - run: security-tests/node_modules/.bin/firebase emulators:exec --project demo-gozen-security --only firestore "node --test security-tests/rules.test.cjs"
