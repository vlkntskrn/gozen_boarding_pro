name: gozen_boarding_pro
description: Gozen Boarding Pro
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  path_provider: ^2.1.4
  share_plus: ^10.1.4
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  crypto: ^3.0.6
  archive: ^3.6.1
  xml: ^6.5.0
  file_picker: ^8.3.7
  flutter_email_sender: ^6.0.3

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  cloud_functions: ^5.1.5
  firebase_app_check: ^0.3.1+5

  excel: ^2.1.0
  universal_html: ^2.2.7
  universal_io: ^2.3.0

  # OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0

dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/company_logo.png
    - assets/forms/
